site_name: LevelCraft Documentation
site_description: Official-style documentation portal for the LevelCraft Minecraft RPG progression plugin by MythicGhoul.
site_url: https://mythicghoul.github.io/LevelCraft/
repo_url: https://github.com/MythicGhoul/LevelCraft
repo_name: MythicGhoul/LevelCraft
edit_uri: edit/main/docs/
copyright: © 2026 MythicGhoul · Independent Minecraft plugin development
theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
  - scheme: slate
    primary: deep purple
    accent: cyan
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  - scheme: default
    primary: deep purple
    accent: cyan
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.indexes
  - navigation.expand
  - navigation.top
  - navigation.footer
  - toc.follow
  - search.suggest
  - search.highlight
  - search.share
  - content.code.copy
  - content.tabs.link
plugins:
- search:
    lang: en
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.tabbed:
    alternate_style: true
extra_css:
- stylesheets/extra.css
extra:
  generator: false
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/MythicGhoul/LevelCraft
  - icon: fontawesome/solid/globe
    link: https://mythicsuite.co.uk/
